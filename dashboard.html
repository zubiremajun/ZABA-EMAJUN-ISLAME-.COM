<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Member Dashboard - JAVIISLAM TECH & LOGISTICS</title>
<style>
:root{
  --maroon:#7f1d1d; --red:#b91c3c; --purple:#6b21a8; --green:#15803d; --gold:#c9a24b;
  --cream:#f7f3e8; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --line:#e8e1cc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--cream);color:var(--text);min-height:100vh;padding-bottom:90px}
button{font-family:inherit}

#splash,#gate{position:fixed;inset:0;background:var(--cream);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#gate{display:none;z-index:60}
.spin{width:42px;height:42px;border:4px solid #e9dfc0;border-top-color:var(--maroon);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
.gate-box{background:#fff;border-radius:16px;padding:28px 22px;max-width:360px;border-top:5px solid var(--red);box-shadow:0 6px 24px rgba(127,29,29,.15)}
.gate-box h2{color:var(--maroon);margin:10px 0 8px;font-size:19px}
.gate-box p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px}

.topbar{position:sticky;top:0;z-index:20;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:#fff;object-fit:cover;flex-shrink:0}
.brand span{font-weight:800;font-size:14px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-out{background:var(--red);color:#fff;border:1px solid rgba(255,255,255,.35);padding:8px 12px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer}

.wrap{max-width:520px;margin:0 auto;padding:14px}
.view{display:none;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

.p-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(127,29,29,.12);border:1px solid var(--line)}
.p-cover{height:84px;background:linear-gradient(120deg,var(--maroon),var(--purple))}
.p-body{padding:0 18px 18px;text-align:center;margin-top:-52px}
.avatar-wrap{position:relative;width:112px;height:112px;margin:0 auto}
.avatar{width:112px;height:112px;border-radius:50%;border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--purple),var(--maroon));overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.cam{position:absolute;right:-2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:var(--green);border:3px solid #fff;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.p-name{font-size:21px;font-weight:800;color:var(--maroon);margin:10px 0 2px}
.p-sub{font-size:13px;color:var(--muted)}

.money{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.m-box{border-radius:14px;padding:12px 10px;text-align:center;color:#fff}
.m-box small{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;opacity:.9}
.m-box b{display:block;font-size:20px;margin-top:4px}
.m-bal{background:linear-gradient(135deg,#15803d,#166534)}
.m-loan{background:linear-gradient(135deg,#b91c3c,#7f1d1d)}

.sec{background:var(--card);border-radius:16px;margin-top:14px;padding:16px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.03)}
.sec h3{margin:0 0 10px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--purple)}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border-bottom:none}
.row span:first-child{color:var(--muted);flex-shrink:0}
.row span:last-child{font-weight:600;text-align:right;word-break:break-word}
.bio{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:10px 0}
.lock{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}

.btn-doc{display:block;width:100%;margin-top:14px;padding:13px;border:none;border-radius:12px;font-weight:800;font-size:15px;color:#3b2a00;background:linear-gradient(135deg,#f5d77a,#c9a24b);cursor:pointer;box-shadow:0 4px 14px rgba(201,162,75,.45)}
.back{background:#fff;border:1.5px solid var(--purple);color:var(--purple);padding:8px 14px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:12px}

.d-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.d-head h2{margin:0;font-size:19px;color:var(--maroon)}
.count{background:var(--maroon);color:#fff;padding:4px 12px;border-radius:50px;font-weight:800;font-size:14px}
.d-grid{display:grid;grid-template-columns:1fr;gap:14px}
.d-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 3px 12px rgba(0,0,0,.06)}
.d-card img{width:100%;max-height:340px;object-fit:cover;display:block;background:#eee;cursor:zoom-in}
.d-note{padding:12px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.d-date{padding:0 14px 12px;font-size:12px;color:var(--muted)}

.search{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:50px;font-size:15px;background:#fff;margin-bottom:10px}
.search:focus{outline:none;border-color:var(--purple)}
.m-list{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.m-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #f0ead6;cursor:pointer}
.m-item:last-child{border-bottom:none}

.m-av{width:50px;height:50px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;background:linear-gradient(135deg,var(--purple),var(--maroon))}
.m-av img{width:100%;height:100%;object-fit:cover}
.m-info{min-width:0}
.m-info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-info small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:2px solid var(--gold);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.nav button{flex:1;max-width:150px;background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:22px;line-height:1}
.nav button.on{color:var(--maroon)}
.nav .nav-doc{position:relative;top:-14px;color:#3b2a00}
.nav .nav-doc .ic{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:27px;background:linear-gradient(135deg,#ffe58a,#c9a24b);box-shadow:0 5px 16px rgba(201,162,75,.65);border:3px solid #fff}
.nav .nav-doc.on{color:var(--maroon)}

  /* ---- Owners button: always glowing ---- */
.nav .nav-glow .ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,#a855f7,#6b21a8);box-shadow:0 0 0 0 rgba(168,85,247,.7);animation:pulseGlow 1.6s infinite;position:relative;overflow:hidden}
.nav .nav-glow .ic::after{content:"";position:absolute;top:-50%;left:-80%;width:40%;height:200%;background:rgba(255,255,255,.6);transform:rotate(25deg);animation:shineSweep 2.4s infinite}
.nav .nav-glow.on{color:var(--maroon)}
@keyframes pulseGlow{0%{box-shadow:0 0 0 0 rgba(168,85,247,.7)}70%{box-shadow:0 0 0 12px rgba(168,85,247,0)}100%{box-shadow:0 0 0 0 rgba(168,85,247,0)}}
@keyframes shineSweep{0%{left:-80%}60%,100%{left:130%}}

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function money(n){ return "৳ " + Number(n || 0).toLocaleString("en-IN"); }
function nameOf(d){ return d.fullName || d.name || d.firstName || "Member"; }
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 2400);
}
function avatarHTML(d){
  const initial = esc(nameOf(d).trim().charAt(0).toUpperCase() || "?");
  return d.photoURL ? `<img src="${esc(d.photoURL)}" alt="">` : initial;
}

 ["home","docs","members","other","owners"].forEach(v => $("v-" + v).classList.toggle("on", v === view));
  $("nav-home").classList.toggle("on", view === "home");

function profileHTML(d, isSelf){

function resizeSquare(file, size, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const m = Math.min(img.width, img.height);
      const sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      const c = document.createElement("canvas"); c.width = c.height = size;
      c.getContext("2d").drawImage(img, sx, sy, m, m, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => reject(new Error("Invalid image"));
    img.src = url;
  });
}

$("photoInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {

  } catch (err) {

    console.error(err);
  }
});

async function openDocs(uid, title, backTo){
  docsFor = { uid, title, backTo };
  show("docs");
  const box = $("v-docs");
  box.innerHTML = `<div class="empty">Loading documents...</div>`;
  try {
    const snap = await getDocs(collection(db, "members", uid, "documents"));
    const items = [];
    snap.forEach(s => items.push({ id: s.id, ...s.data() }));
    items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

    box.innerHTML = `
      ${backTo === "other" ? `<button class="back" id="docBack">← Back to profile</button>` : ""}
      <div class="d-head"><h2>📄 ${esc(title)}</h2><span class="count">${items.length}</span></div>
      ${items.length ? `<div class="d-grid">${items.map(it => `
        <div class="d-card">
          ${it.image ? `<img src="${esc(it.image)}" alt="Document" data-full="1">` : ""}
          ${it.note ? `<div class="d-note">${esc(it.note)}</div>` : ""}
          <div class="d-date">${it.createdAt?.seconds ? new Date(it.createdAt.seconds * 1000).toLocaleDateString() : ""}</div>
        </div>`).join("")}</div>`
      : `<div class="sec"><div class="empty">No documents yet.<br><b style="font-size:26px">0</b></div></div>`}
      <div class="lock">🔒 Documents can only be added by the admin</div>`;

    box.querySelectorAll("img[data-full]").forEach(im => im.onclick = () => openLight(im.src));
    const bk = $("docBack"); if (bk) bk.onclick = () => show("other");
  } catch (err) {
    box.innerHTML = `<div class="sec"><div class="empty">Could not load documents.<br>${esc(err.message)}</div></div>`;
  }
}

function openLight(src){ $("lightImg").src = src; $("lightbox").style.display = "flex"; }
$("lightbox").onclick = () => { $("lightbox").style.display = "none"; };

async function loadMembers(){
  if (membersCache) return membersCache;
  const snap = await getDocs(collection(db, "members"));
  const list = [];
  snap.forEach(s => {
    const d = s.data();
    if ((d.status || "pending") === "active") list.push({ id: s.id, ...d });
  });
  list.sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
  membersCache = list;
  return list;
}

function renderMemberList(){
  const q = $("memberSearch").value.trim().toLowerCase();
  const list = (membersCache || []).filter(d =>
    !q || [nameOf(d), d.email, d.mobileNumber, d.phone, d.firstName].some(x => String(x || "").toLowerCase().includes(q)));
  $("memberList").innerHTML = list.length ? list.map(d => `
    <div class="m-item" data-id="${esc(d.id)}">
      <div class="m-av">${avatarHTML(d)}</div>
      <div class="m-info"><b>${esc(nameOf(d))}</b><small>${esc(d.occupation || d.email || "")}</small></div>
    </div>`).join("") : `<div class="empty" style="padding:22px">No members found.</div>`;
  $("memberList").querySelectorAll(".m-item").forEach(el => el.onclick = () => openOther(el.dataset.id));
}

async function openMembers(){
  show("members");
  membersCache = null; // refresh each time so new photos/approvals show up
  $("memberList").innerHTML = `<div class="empty" style="padding:22px">Loading members...</div>`;
  try { await loadMembers(); renderMemberList(); }
  catch (err) { $("memberList").innerHTML = `<div class="empty" style="padding:22px">Could not load members.<br>${esc(err.message)}</div>`; }
}

function openOther(uid){
  if (uid === me.uid){ show("home"); return; }
  const d = (membersCache || []).find(x => x.id === uid);

  $("v-other").innerHTML = `

  $("otherBack").onclick = () => show("members");
  $("otherDocs").onclick = () => openDocs(uid, nameOf(d) + "'s Documents", "other");
  show("other");
}

let ownersLanguage = "bn";

function renderOwnersPage() {
  const L = OWNER_LABELS[ownersLanguage];

  $("v-owners").innerHTML = `
    <div class="owners-heading">
      <h2>JAVIISLAM Leadership</h2>
      <p>
        ${ownersLanguage === "bn"
          ? "কোম্পানির মালিক ও পরিচালনা পর্ষদ"
          : ownersLanguage === "ur"
          ? "کمپنی کے مالک اور انتظامی قیادت"
          : "Company Owner & Leadership Team"}
      </p>
    </div>

    <div class="owners-grid">
      ${OWNERS.map((o, index) => `
        <article class="owner-premium-card">

          <div class="owner-premium-photo">
            <img src="${o.photo}" alt="${esc(o.name)}">
          </div>

          <h3 class="owner-premium-name">
            ${esc(o.name)}
          </h3>

          <div class="owner-premium-role">
            ${esc(o.role[ownersLanguage])}
          </div>

          <button
            class="owner-detail-btn"
            type="button"
            data-owner-toggle="${index}">
            ${L.details}
          </button>

          <section
            class="owner-detail-panel"
            id="owner-detail-${index}">

            <h3>${L.expertise}</h3>

            <div class="owner-language-label">
              ${L.lang}
            </div>

            <div class="owner-language-switch">

              <button type="button"
                data-owner-lang="bn"
                class="${ownersLanguage === "bn" ? "active" : ""}">
                বাংলা
              </button>

              <button type="button"
                data-owner-lang="en"
                class="${ownersLanguage === "en" ? "active" : ""}">
                English
              </button>

              <button type="button"
                data-owner-lang="ur"
                class="${ownersLanguage === "ur" ? "active" : ""}">
                اردو
              </button>

            </div>

            <div class="owner-bio-text">
              ${esc(o.bio[ownersLanguage])}
            </div>

          </section>
        </article>
      `).join("")}
    </div>

    <div class="owners-team-note">
      <h3>${L.team}</h3>
      <p>${L.teamText}</p>
    </div>
  `;

  /* Details buttons */
  $("v-owners").querySelectorAll("[data-owner-toggle]")
    .forEach(btn => {
      btn.addEventListener("click", () => {

        const panel = $("owner-detail-" + btn.dataset.ownerToggle);

        const willOpen = !panel.classList.contains("open");

        panel.classList.toggle("open", willOpen);

        btn.textContent = willOpen
          ? OWNER_LABELS[ownersLanguage].hide
          : OWNER_LABELS[ownersLanguage].details;
      });
    });

  /* Offline language switching */
  $("v-owners").querySelectorAll("[data-owner-lang]")
    .forEach(btn => {

      btn.addEventListener("click", () => {

        ownersLanguage = btn.dataset.ownerLang;

        const openPanels = OWNERS.map((_, i) =>
          $("owner-detail-" + i)?.classList.contains("open") || false
        );

        renderOwnersPage();

        openPanels.forEach((isOpen, i) => {

          if (!isOpen) return;

          const panel = $("owner-detail-" + i);

          if (panel) {
            panel.classList.add("open");

            const toggle = $("v-owners").querySelector(
              `[data-owner-toggle="${i}"]`
            );

            if (toggle) {
              toggle.textContent = OWNER_LABELS[ownersLanguage].hide;
            }
          }
        });
      });
    });
}

function openOwners() {
  ownersLanguage = "bn";
  renderOwnersPage();
  show("owners");
}

$("nav-owners").onclick = openOwners;
  
function doLogout(){ signOut(auth).then(() => { window.location.href = "index.html"; }); }
$("logoutBtn").onclick = doLogout;
$("gateLogout").onclick = doLogout;

function gate(icon, title, msg){
  $("splash").style.display = "none";
  $("gateIcon").textContent = icon; $("gateTitle").textContent = title; $("gateMsg").textContent = msg;
  $("gate").style.display = "flex";
}

let started = false;
onAuthStateChanged(auth, (user) => {
  if (!user){ window.location.href = "index.html"; return; }
  me = user;
  if (started) return;
  started = true;

  const isAdmin = (user.email || "").toLowerCase() === ADMIN_EMAIL;

  onSnapshot(doc(db, "members", user.uid), (snap) => {
    if (!snap.exists()){
      gate("❓", "Profile Not Found", "No member record was found for this account. Please contact the admin.");
      return;
    }
    myData = snap.data();
    const status = myData.status || "pending";

    if (!isAdmin && status === "blocked"){
      gate("🚫", "Account Blocked", "Your account has been suspended. Please contact the admin.");
      return;
    }
    if (!isAdmin && status !== "active"){
      gate("⏳", "Approval Pending", "Your registration is complete. Please wait while the admin approves your account.");
      return;
    }
    $("gate").style.display = "none";
    $("splash").style.display = "none";
    renderHome();
  }, (err) => {
    gate("⚠️", "Connection Problem", "Could not load your profile: " + err.message);
  });
});

setTimeout(() => {
  if ($("splash").style.display !== "none" && !myData){
    gate("⚠️", "Taking too long", "Please check your internet connection and reload the page.");
  }
}, 12000);
</script>
