<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Member Dashboard - JAVIISLAM TECH & LOGISTICS</title>
<style>
:root{
  --maroon:#7f1d1d; --red:#b91c3c; --purple:#6b21a8; --green:#15803d; --gold:#c9a24b;
  --cream:#f7f3e8; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --line:#e8e1cc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--cream);color:var(--text);min-height:100vh;padding-bottom:90px}
button{font-family:inherit}

#splash,#gate{position:fixed;inset:0;background:var(--cream);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#gate{display:none;z-index:60}
.spin{width:42px;height:42px;border:4px solid #e9dfc0;border-top-color:var(--maroon);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
.gate-box{background:#fff;border-radius:16px;padding:28px 22px;max-width:360px;border-top:5px solid var(--red);box-shadow:0 6px 24px rgba(127,29,29,.15)}
.gate-box h2{color:var(--maroon);margin:10px 0 8px;font-size:19px}
.gate-box p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px}

.topbar{position:sticky;top:0;z-index:20;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:#fff;object-fit:cover;flex-shrink:0}
.brand span{font-weight:800;font-size:14px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-out{background:var(--red);color:#fff;border:1px solid rgba(255,255,255,.35);padding:8px 12px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer}

.wrap{max-width:520px;margin:0 auto;padding:14px}
.view{display:none;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

.p-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(127,29,29,.12);border:1px solid var(--line)}
.p-cover{height:84px;background:linear-gradient(120deg,var(--maroon),var(--purple))}
.p-body{padding:0 18px 18px;text-align:center;margin-top:-52px}
.avatar-wrap{position:relative;width:112px;height:112px;margin:0 auto}
.avatar{width:112px;height:112px;border-radius:50%;border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--purple),var(--maroon));overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.cam{position:absolute;right:-2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:var(--green);border:3px solid #fff;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.p-name{font-size:21px;font-weight:800;color:var(--maroon);margin:10px 0 2px}
.p-sub{font-size:13px;color:var(--muted)}

.money{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.m-box{border-radius:14px;padding:12px 10px;text-align:center;color:#fff}
.m-box small{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;opacity:.9}
.m-box b{display:block;font-size:20px;margin-top:4px}
.m-bal{background:linear-gradient(135deg,#15803d,#166534)}
.m-loan{background:linear-gradient(135deg,#b91c3c,#7f1d1d)}
  
.m-bal{cursor:pointer}
.m-loan{cursor:pointer}
.m-box em{display:block;font-size:10px;font-style:normal;opacity:.9;margin-top:3px}
.dep-total{background:linear-gradient(135deg,#15803d,#166534);color:#fff;border-radius:14px;padding:14px;text-align:center;margin-bottom:12px}
.dep-total b{display:block;font-size:24px;margin-top:4px}
.dep-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.dep-item b{color:var(--green);font-size:16px}
.dep-item small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
  
.sec{background:var(--card);border-radius:16px;margin-top:14px;padding:16px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.03)}
.sec h3{margin:0 0 10px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--purple)}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border-bottom:none}
.row span:first-child{color:var(--muted);flex-shrink:0}
.row span:last-child{font-weight:600;text-align:right;word-break:break-word}
.bio{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:10px 0}
.lock{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}

.btn-doc{display:block;width:100%;margin-top:14px;padding:13px;border:none;border-radius:12px;font-weight:800;font-size:15px;color:#3b2a00;background:linear-gradient(135deg,#f5d77a,#c9a24b);cursor:pointer;box-shadow:0 4px 14px rgba(201,162,75,.45)}
.back{background:#fff;border:1.5px solid var(--purple);color:var(--purple);padding:8px 14px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:12px}

.d-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.d-head h2{margin:0;font-size:19px;color:var(--maroon)}
.count{background:var(--maroon);color:#fff;padding:4px 12px;border-radius:50px;font-weight:800;font-size:14px}
.d-grid{display:grid;grid-template-columns:1fr;gap:14px}
.d-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 3px 12px rgba(0,0,0,.06)}
.d-card img{width:100%;max-height:340px;object-fit:cover;display:block;background:#eee;cursor:zoom-in}
.d-note{padding:12px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.d-date{padding:0 14px 12px;font-size:12px;color:var(--muted)}

.search{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:50px;font-size:15px;background:#fff;margin-bottom:10px}
.search:focus{outline:none;border-color:var(--purple)}
.m-list{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.m-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #f0ead6;cursor:pointer}
.m-item:last-child{border-bottom:none}
.m-item:active{background:#faf6ea}
.m-av{width:50px;height:50px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;background:linear-gradient(135deg,var(--purple),var(--maroon))}
.m-av img{width:100%;height:100%;object-fit:cover}
.m-info{min-width:0}
.m-info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-info small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:2px solid var(--gold);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.nav button{flex:1;max-width:150px;background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:22px;line-height:1}
.nav button.on{color:var(--maroon)}
.nav .nav-doc{position:relative;top:-14px;color:#3b2a00}
.nav .nav-doc .ic{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:27px;background:linear-gradient(135deg,#ffe58a,#c9a24b);box-shadow:0 5px 16px rgba(201,162,75,.65);border:3px solid #fff}
.nav .nav-doc.on{color:var(--maroon)}

  /* ---- Owners button: always glowing ---- */
.nav .nav-glow .ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,#a855f7,#6b21a8);box-shadow:0 0 0 0 rgba(168,85,247,.7);animation:pulseGlow 1.6s infinite;position:relative;overflow:hidden}
.nav .nav-glow .ic::after{content:"";position:absolute;top:-50%;left:-80%;width:40%;height:200%;background:rgba(255,255,255,.6);transform:rotate(25deg);animation:shineSweep 2.4s infinite}
.nav .nav-glow.on{color:var(--maroon)}
@keyframes pulseGlow{0%{box-shadow:0 0 0 0 rgba(168,85,247,.7)}70%{box-shadow:0 0 0 12px rgba(168,85,247,0)}100%{box-shadow:0 0 0 0 rgba(168,85,247,0)}}
@keyframes shineSweep{0%{left:-80%}60%,100%{left:130%}}

/* ---- Owners page ---- */
.o-card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:18px;text-align:center;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.o-photo{width:120px;height:120px;border-radius:50%;border:4px solid var(--gold);margin:0 auto 10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--purple),var(--maroon));box-shadow:0 4px 14px rgba(0,0,0,.2)}
.o-photo img{width:100%;height:100%;object-fit:cover}
.o-name{font-size:18px;font-weight:800;color:var(--maroon)}
.o-role{font-size:13px;color:var(--muted);margin-top:2px}
.o-info{margin-bottom:14px}
.o-info h3{margin:0 0 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--purple)}
.o-info p{margin:0;font-size:14px;line-height:1.7;white-space:pre-wrap}
/* ---- Group Chat ---- */
.nav button .ic{font-size:22px}
.chat-top{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.chat-top h2{margin:0;font-size:17px;color:var(--maroon)}
.chat-call{background:var(--green);color:#fff;border:none;border-radius:50px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.chat-box{background:#fff;border:1px solid var(--line);border-radius:14px;height:calc(100vh - 300px);min-height:260px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;display:flex;flex-direction:column}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.other{align-self:flex-start}
.msg .who{font-size:11px;color:var(--muted);margin:0 6px 2px}
.msg .bub{padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.msg.me .bub{background:linear-gradient(135deg,var(--purple),var(--maroon));color:#fff;border-bottom-right-radius:4px}
.msg.other .bub{background:#f3efe0;color:var(--text);border-bottom-left-radius:4px}
.msg .bub img{max-width:100%;border-radius:10px;display:block;cursor:zoom-in}
.msg .bub audio{max-width:220px;height:36px}
.msg .meta{font-size:10px;color:var(--muted);margin:2px 6px;display:flex;gap:8px}
.msg .meta b{color:var(--red);cursor:pointer;font-weight:600}
.chat-bar{display:flex;gap:6px;align-items:center;margin-top:10px}
.chat-bar input[type=text]{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:50px;font-size:15px;background:#fff}
.chat-bar input[type=text]:focus{outline:none;border-color:var(--purple)}
.chat-bar button{width:44px;height:44px;flex-shrink:0;border:none;border-radius:50%;background:var(--purple);color:#fff;font-size:18px;cursor:pointer}
.chat-bar button.send{background:var(--green)}
.chat-bar button.rec{background:var(--red);animation:pulseGlow 1s infinite}
#incomingBar{display:none;position:fixed;top:0;left:0;right:0;z-index:300;background:#15803d;color:#fff;padding:12px 16px;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#incomingBar button{border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
#callModal{display:none;position:fixed;inset:0;background:#000;z-index:400;flex-direction:column}
#callModal .cm-top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#1f2937;color:#fff}
#callModal iframe{flex:1;width:100%;border:0}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:none;align-items:center;justify-content:center;padding:12px}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:50px;font-size:14px;z-index:90;display:none}
</style>
</head>
<body>

<div id="gate">

 <section class="view" id="v-loans"></section>

<nav class="nav">
  <button id="nav-home" class="on"><span class="ic">👤</span>Profile</button>
  <button id="nav-docs" class="nav-doc"><span class="ic">📄</span>Documents</button>
  <button id="nav-members"><span class="ic">👥</span>Members</button>

<div id="incomingBar">
  <span id="incomingText"></span>

</div>
<div id="lightbox"><img id="lightImg" alt=""></div>

<input type="file" id="photoInput" accept="image/*" style="display:none">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, onSnapshot, updateDoc, collection, getDocs , addDoc, deleteDoc, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyANnOJ_5DiOY3h5q1sVdXqrAblSGynCqKQ",
  authDomain: "zaba-emajun-islam.firebaseapp.com",
  projectId: "zaba-emajun-islam",
  storageBucket: "zaba-emajun-islam.firebasestorage.app",
  messagingSenderId: "593592059226",
  appId: "1:593592059226:web:bfd81719f87e065dc19f63"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL = "zubirosmani0@gmail.com";
const $ = (id) => document.getElementById(id);

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function money(n){ return "৳ " + Number(n || 0).toLocaleString("en-IN"); }
function nameOf(d){ return d.fullName || d.name || d.firstName || "Member"; }
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 2400);
}
function avatarHTML(d){
  const initial = esc(nameOf(d).trim().charAt(0).toUpperCase() || "?");
  return d.photoURL ? `<img src="${esc(d.photoURL)}" alt="">` : initial;
}

let me = null;
let myData = null;
let membersCache = null;
let docsFor = null;

function show(view){
  ["home","docs","members","other","owners","deposits","loans","chat"].forEach(v => $("v-" + v).classList.toggle("on", v === view));
  $("nav-home").classList.toggle("on", view === "home");
  $("nav-docs").classList.toggle("on", view === "docs" && !!docsFor && docsFor.uid === me.uid);
  $("nav-members").classList.toggle("on", view === "members" || view === "other");
  $("nav-owners").classList.toggle("on", view === "owners");
  $("nav-chat").classList.toggle("on", view === "chat");
  window.scrollTo(0, 0);
}

function profileHTML(d, isSelf){
  const rows = [
    ["First Name", d.firstName],
    ["Full Name", d.fullName || d.name],
    ["Father's Name", d.fatherName],
    ["Mother's Name", d.motherName],
    ["Birth Place", d.birthPlace],
    ["Present Address", d.presentAddress],
    ["Phone", d.mobileNumber || d.phone],
    ["Email", d.email]
  ].map(r => `<div class="row"><span>${r[0]}</span><span>${esc(r[1] || "—")}</span></div>`).join("");

  return `
  <div class="p-card">
    <div class="p-cover"></div>
    <div class="p-body">
      <div class="avatar-wrap">
        <div class="avatar">${avatarHTML(d)}</div>
        ${isSelf ? `<div class="cam" id="camBtn" title="Change photo">📷</div>` : ""}
      </div>
      <div class="p-name">${esc(nameOf(d))}</div>
      <div class="p-sub">${esc(d.occupation || "Member")}</div>
      <div class="money">
        <div class="m-box m-bal" data-dep="${isSelf ? me.uid : esc(d.id)}" data-name="${esc(nameOf(d))}" data-self="${isSelf ? 1 : 0}"><small>Deposit / Balance</small><b>${money(d.balance)}</b><em>👆 View history</em></div>
        <div class="m-box m-loan" data-loan="${isSelf ? me.uid : esc(d.id)}" data-name="${esc(nameOf(d))}" data-self="${isSelf ? 1 : 0}"><small>Loan</small><b>${money(d.loan)}</b><em>👆 View history</em></div>
      </div>
    </div>
  </div>
  <div class="sec">
    <h3>About</h3>
    ${d.bio ? `<div class="bio">${esc(d.bio)}</div>` : `<div class="empty">No bio added yet.</div>`}
  </div>
  <div class="sec">
    <h3>Member Information</h3>
    ${rows}
    <div class="lock">🔒 Only the admin can change this information</div>
  </div>`;
}

function renderHome(){
  $("v-home").innerHTML = profileHTML(myData, true);
  const cam = $("camBtn");
  if (cam) cam.onclick = () => $("photoInput").click();
}

function resizeSquare(file, size, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const m = Math.min(img.width, img.height);
      const sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      const c = document.createElement("canvas"); c.width = c.height = size;
      c.getContext("2d").drawImage(img, sx, sy, m, m, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => reject(new Error("Invalid image"));
    img.src = url;
  });
}

$("photoInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    toast("Uploading photo...");
    const data = await resizeSquare(file, 400, 0.8);
    await updateDoc(doc(db, "members", me.uid), { photoURL: data });
    toast("Profile photo updated ✔");
  } catch (err) {
    toast("Photo upload failed");
    console.error(err);
  }
});

async function openDocs(uid, title, backTo){
  docsFor = { uid, title, backTo };
  show("docs");
  const box = $("v-docs");
  box.innerHTML = `<div class="empty">Loading documents...</div>`;
  try {
    const snap = await getDocs(collection(db, "members", uid, "documents"));
    const items = [];
    snap.forEach(s => items.push({ id: s.id, ...s.data() }));
    items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

    box.innerHTML = `
      ${backTo === "other" ? `<button class="back" id="docBack">← Back to profile</button>` : ""}
      <div class="d-head"><h2>📄 ${esc(title)}</h2><span class="count">${items.length}</span></div>
      ${items.length ? `<div class="d-grid">${items.map(it => `
        <div class="d-card">
          ${it.image ? `<img src="${esc(it.image)}" alt="Document" data-full="1">` : ""}
          ${it.note ? `<div class="d-note">${esc(it.note)}</div>` : ""}
          <div class="d-date">${it.createdAt?.seconds ? new Date(it.createdAt.seconds * 1000).toLocaleDateString() : ""}</div>
        </div>`).join("")}</div>`
      : `<div class="sec"><div class="empty">No documents yet.<br><b style="font-size:26px">0</b></div></div>`}
      <div class="lock">🔒 Documents can only be added by the admin</div>`;

    box.querySelectorAll("img[data-full]").forEach(im => im.onclick = () => openLight(im.src));
    const bk = $("docBack"); if (bk) bk.onclick = () => show("other");
  } catch (err) {
    box.innerHTML = `<div class="sec"><div class="empty">Could not load documents.<br>${esc(err.message)}</div></div>`;
  }
}

async function openDeposits(uid, name, isSelf){
  show("deposits");
  const box = $("v-deposits");
  box.innerHTML = `<div class="empty">Loading...</div>`;
  try{
    const snap = await getDocs(collection(db, "members", uid, "deposits"));
    const items = [];
    snap.forEach(s => items.push({ id: s.id, ...s.data() }));
    const T = x => (x.depositDate?.seconds || x.createdAt?.seconds || 0);
    items.sort((a, b) => T(b) - T(a));
    const total = items.reduce((s, x) => s + Number(x.amount || 0), 0);
    box.innerHTML = `
      <button class="back" id="depBack">← Back</button>
      <div class="dep-total"><small>${esc(isSelf ? "My" : name)} Total Deposits</small><b>${money(total)}</b></div>
      ${items.length ? items.map(x => `
        <div class="dep-item">
          <b>${money(x.amount)}</b>
          <small>📅 ${T(x) ? new Date(T(x) * 1000).toLocaleString("en-GB", {dateStyle:"medium", timeStyle:"short"}) : "—"}</small>
          ${x.note ? `<small>📝 ${esc(x.note)}</small>` : ""}
        </div>`).join("") : `<div class="sec"><div class="empty">No deposits yet.</div></div>`}`;
    $("depBack").onclick = () => show(isSelf ? "home" : "other");
  }catch(err){
    box.innerHTML = `<div class="sec"><div class="empty">Could not load.<br>${esc(err.message)}</div></div>`;
  }
}

function openLight(src){ $("lightImg").src = src; $("lightbox").style.display = "flex"; }
$("lightbox").onclick = () => { $("lightbox").style.display = "none"; };

async function loadMembers(){
  if (membersCache) return membersCache;
  const snap = await getDocs(collection(db, "members"));
  const list = [];
  snap.forEach(s => {
    const d = s.data();
    if ((d.status || "pending") === "active") list.push({ id: s.id, ...d });
  });
  list.sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
  membersCache = list;
  return list;
}

function renderMemberList(){
  const q = $("memberSearch").value.trim().toLowerCase();
  const list = (membersCache || []).filter(d =>
    !q || [nameOf(d), d.email, d.mobileNumber, d.phone, d.firstName].some(x => String(x || "").toLowerCase().includes(q)));
  $("memberList").innerHTML = list.length ? list.map(d => `
    <div class="m-item" data-id="${esc(d.id)}">
      <div class="m-av">${avatarHTML(d)}</div>
      <div class="m-info"><b>${esc(nameOf(d))}</b><small>${esc(d.occupation || d.email || "")}</small></div>
    </div>`).join("") : `<div class="empty" style="padding:22px">No members found.</div>`;
  $("memberList").querySelectorAll(".m-item").forEach(el => el.onclick = () => openOther(el.dataset.id));
}

async function openMembers(){
  show("members");
  membersCache = null; // refresh each time so new photos/approvals show up
  $("memberList").innerHTML = `<div class="empty" style="padding:22px">Loading members...</div>`;
  try { await loadMembers(); renderMemberList(); }
  catch (err) { $("memberList").innerHTML = `<div class="empty" style="padding:22px">Could not load members.<br>${esc(err.message)}</div>`; }
}
$("memberSearch").addEventListener("input", renderMemberList);

function openOther(uid){
  if (uid === me.uid){ show("home"); return; }
  const d = (membersCache || []).find(x => x.id === uid);
  if (!d) return;
  $("v-other").innerHTML = `
    <button class="back" id="otherBack">← Back</button>
    ${profileHTML(d, false)}
    <button class="btn-doc" id="otherDocs">📄 Documents</button>`;
  $("otherBack").onclick = () => show("members");
  $("otherDocs").onclick = () => openDocs(uid, nameOf(d) + "'s Documents", "other");
  show("other");
}

let ownersLanguage = "bn";

function renderOwnersPage() {
  const L = OWNER_LABELS[ownersLanguage];

  $("v-owners").innerHTML = `
    <div class="owners-heading">
      <h2>JAVIISLAM Leadership</h2>
      <p>
        ${ownersLanguage === "bn"
          ? "কোম্পানির মালিক ও পরিচালনা পর্ষদ"
          : ownersLanguage === "ur"
          ? "کمپنی کے مالک اور انتظامی قیادت"
          : "Company Owner & Leadership Team"}
      </p>
    </div>

    <div class="owners-grid">
      ${OWNERS.map((o, index) => `
        <article class="owner-premium-card">

          <div class="owner-premium-photo">
            <img src="${o.photo}" alt="${esc(o.name)}">
          </div>

          <h3 class="owner-premium-name">
            ${esc(o.name)}
          </h3>

          <div class="owner-premium-role">
            ${esc(o.role[ownersLanguage])}
          </div>

          <button
            class="owner-detail-btn"
            type="button"
            data-owner-toggle="${index}">
            ${L.details}
          </button>

          <section
            class="owner-detail-panel"
            id="owner-detail-${index}">

            <h3>${L.expertise}</h3>

            <div class="owner-language-label">
              ${L.lang}
            </div>

            <div class="owner-language-switch">

              <button type="button"
                data-owner-lang="bn"
                class="${ownersLanguage === "bn" ? "active" : ""}">
                বাংলা
              </button>

              <button type="button"
                data-owner-lang="en"
                class="${ownersLanguage === "en" ? "active" : ""}">
                English
              </button>

              <button type="button"
                data-owner-lang="ur"
                class="${ownersLanguage === "ur" ? "active" : ""}">
                اردو
              </button>

            </div>

            <div class="owner-bio-text">
              ${esc(o.bio[ownersLanguage])}
            </div>

          </section>
        </article>
      `).join("")}
    </div>

    <div class="owners-team-note">
      <h3>${L.team}</h3>
      <p>${L.teamText}</p>
    </div>
  `;

  /* Details buttons */
  $("v-owners").querySelectorAll("[data-owner-toggle]")
    .forEach(btn => {
      btn.addEventListener("click", () => {

        const panel = $("owner-detail-" + btn.dataset.ownerToggle);

        const willOpen = !panel.classList.contains("open");

        panel.classList.toggle("open", willOpen);

        btn.textContent = willOpen
          ? OWNER_LABELS[ownersLanguage].hide
          : OWNER_LABELS[ownersLanguage].details;
      });
    });

  /* Offline language switching */
  $("v-owners").querySelectorAll("[data-owner-lang]")
    .forEach(btn => {

      btn.addEventListener("click", () => {

        ownersLanguage = btn.dataset.ownerLang;

        const openPanels = OWNERS.map((_, i) =>
          $("owner-detail-" + i)?.classList.contains("open") || false
        );

        renderOwnersPage();

        openPanels.forEach((isOpen, i) => {

          if (!isOpen) return;

          const panel = $("owner-detail-" + i);

          if (panel) {
            panel.classList.add("open");

            const toggle = $("v-owners").querySelector(
              `[data-owner-toggle="${i}"]`
            );

            if (toggle) {
              toggle.textContent = OWNER_LABELS[ownersLanguage].hide;
            }
          }
        });
      });
    });
}

function openOwners() {
  ownersLanguage = "bn";
  renderOwnersPage();
  show("owners");
}

$("nav-owners").onclick = openOwners;

  $("chatMic").onclick = toggleVoice;
  $("chatCall").onclick = () => toast("Call feature coming soon");
}

function openChat(){
  show("chat");
  chatSkeleton();
  if (chatUnsub) chatUnsub();
  const q = query(collection(db, "groupChat"), orderBy("createdAt", "desc"), limit(100));
  chatUnsub = onSnapshot(q, (snap) => {
    const box = $("chatBox");
    if (!box) return;
    const items = [];
    snap.forEach(s => items.push({ id: s.id, ...s.data() }));
    items.reverse();
    if (!items.length){ box.innerHTML = `<div class="empty">No messages yet. Say Salam 👋</div>`; return; }
    const isAdmin = (me.email || "").toLowerCase() === ADMIN_EMAIL;
    box.innerHTML = items.map(m => {
      const mine = m.senderId === me.uid;
      let body = "";
      if (m.type === "image") body = `<img src="${esc(m.media)}" alt="" data-full="1">`;
      else if (m.type === "voice") body = `<audio controls src="${esc(m.media)}"></audio>`;
      else body = esc(m.text);
      const t = m.createdAt?.seconds ? new Date(m.createdAt.seconds * 1000).toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"}) : "";
      const canDel = mine || isAdmin;
      return `<div class="msg ${mine ? "me" : "other"}">
        ${mine ? "" : `<div class="who">${esc(m.senderName || "Member")}</div>`}
        <div class="bub">${body}</div>
        <div class="meta"><span>${t}</span>${canDel ? `<b data-del="${esc(m.id)}">Delete</b>` : ""}</div>
      </div>`;
    }).join("");
    box.scrollTop = box.scrollHeight;
    box.querySelectorAll("img[data-full]").forEach(im => im.onclick = () => openLight(im.src));
    box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if (!confirm("Delete this message for everyone?")) return;
      try { await deleteDoc(doc(db, "groupChat", b.dataset.del)); }
      catch (err) { toast("Delete failed"); console.error(err); }
    });
  }, (err) => {
    const box = $("chatBox");
    if (box) box.innerHTML = `<div class="empty">Could not load chat.<br>${esc(err.message)}</div>`;
  });
}

async function postChat(data){
  await addDoc(collection(db, "groupChat"), {
    senderId: me.uid,
    senderName: nameOf(myData),
    createdAt: serverTimestamp(),
    ...data
  });
}

async function sendChatText(){
  const inp = $("chatText");
  const text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  try { await postChat({ type: "text", text }); }
  catch (err) { toast("Send failed"); console.error(err); inp.value = text; }
}

function resizeFit(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => reject(new Error("Invalid image"));
    img.src = url;
  });
}

async function sendChatImage(e){
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    toast("Sending photo...");
    let data = await resizeFit(file, 800, 0.6);
    if (data.length > 650000) data = await resizeFit(file, 600, 0.5);
    if (data.length > 650000){ toast("Photo too large"); return; }
    await postChat({ type: "image", media: data });
  } catch (err) { toast("Photo failed"); console.error(err); }
}

async function toggleVoice(){
  const btn = $("chatMic");
  if (chatRecorder && chatRecorder.state === "recording"){ chatRecorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chatChunks = [];
    const opts = {};
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) opts.mimeType = "audio/webm;codecs=opus";
    opts.audioBitsPerSecond = 16000;
    chatRecorder = new MediaRecorder(stream, opts);
    chatRecorder.ondataavailable = ev => { if (ev.data.size) chatChunks.push(ev.data); };
    chatRecorder.onstop = async () => {
      clearTimeout(chatTimer);
      stream.getTracks().forEach(t => t.stop());
      btn.classList.remove("rec"); btn.textContent = "🎤";
      const blob = new Blob(chatChunks, { type: chatRecorder.mimeType || "audio/webm" });
      if (!blob.size) return;
      const reader = new FileReader();
      reader.onloadend = async () => {
        const data = reader.result;
        if (data.length > 650000){ toast("Voice too long (max ~30 sec)"); return; }
        try {
          toast("Sending voice...");
          await postChat({ type: "voice", media: data, duration: Math.round((Date.now() - chatStart) / 1000) });
        } catch (err) { toast("Voice failed"); console.error(err); }
      };
      reader.readAsDataURL(blob);
    };
    chatStart = Date.now();
    chatRecorder.start();
    btn.classList.add("rec"); btn.textContent = "⏹";
    chatTimer = setTimeout(() => { if (chatRecorder.state === "recording") chatRecorder.stop(); }, 30000);
  } catch (err) {
    toast("Microphone not allowed");
    console.error(err);
  }
}

$("nav-chat").onclick = openChat;
  
function doLogout(){ signOut(auth).then(() => { window.location.href = "index.html"; }); }
$("logoutBtn").onclick = doLogout;
$("gateLogout").onclick = doLogout;

function gate(icon, title, msg){
  $("splash").style.display = "none";
  $("gateIcon").textContent = icon; $("gateTitle").textContent = title; $("gateMsg").textContent = msg;
  $("gate").style.display = "flex";
}

let started = false;
onAuthStateChanged(auth, (user) => {
  if (!user){ window.location.href = "index.html"; return; }
  me = user;
  if (started) return;
  started = true;

  const isAdmin = (user.email || "").toLowerCase() === ADMIN_EMAIL;

  onSnapshot(doc(db, "members", user.uid), (snap) => {
    if (!snap.exists()){
      gate("❓", "Profile Not Found", "No member record was found for this account. Please contact the admin.");
      return;
    }
    myData = snap.data();
    const status = myData.status || "pending";

    if (!isAdmin && status === "blocked"){
      gate("🚫", "Account Blocked", "Your account has been suspended. Please contact the admin.");
      return;
    }
    if (!isAdmin && status !== "active"){
      gate("⏳", "Approval Pending", "Your registration is complete. Please wait while the admin approves your account.");
      return;
    }
    $("gate").style.display = "none";
    $("splash").style.display = "none";
    renderHome();
  }, (err) => {
    gate("⚠️", "Connection Problem", "Could not load your profile: " + err.message);
  });
});

setTimeout(() => {
  if ($("splash").style.display !== "none" && !myData){
    gate("⚠️", "Taking too long", "Please check your internet connection and reload the page.");
  }
}, 12000);
