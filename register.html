<!-- 1. EmailJS & Firebase Official Libraries Connection -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script type="module">
  // Import Firebase Functions
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 🔥 Firebase Database Configuration (Your verified bridge)
  const firebaseConfig = {
    apiKey: "AIzaSyANnOJ_5DiOY3h5q1sVdXqrAblSGynCqKQ",
    authDomain: "zaba-emajun-islam.firebaseapp.com",
    projectId: "zaba-emajun-islam",
    storageBucket: "zaba-emajun-islam.firebasestorage.app",
    messagingSenderId: "593592059226",
    appId: "1:593592059226:web:bfd81719f87e065dc19f63"
  };

  // Initialize Firebase Services
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ✉️ Initialize EmailJS (Your Verified Public Key Connected Here)
  emailjs.init("3Hbg-0gXLuoRnX2pC"); 

  let generatedOTP = null;
  let tempUserData = {};

  // STEP 1: Registration Form Submission Handler
  document.getElementById("registrationForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // Collect data from HTML Input fields
    tempUserData = {
      name: document.getElementById("fullName").value,
      phone: document.getElementById("phoneNumber").value,
      email: document.getElementById("emailAddress").value,
      password: document.getElementById("password").value
    };

    // Generate random 6-digit OTP code (Changes automatically every time)
    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

    // Prepare parameters matching your EmailJS Template
    const emailParams = {
      to_email: tempUserData.email,
      to_name: tempUserData.name,
      otp_code: generatedOTP
    };

    // Send OTP email via your verified Service ID and Template ID
    emailjs.send("service_pf74nir", "template_843o01l", emailParams)
      .then(function() {
        alert("An OTP code has been successfully sent to your Gmail!");
        document.getElementById("otpSection").style.display = "block"; // Show OTP verification box
      }, function(error) {
        alert("EmailJS Error: Failed to send OTP. Please check your connection IDs.");
        console.log("Error details:", error);
      });
  });

  // STEP 2: Verify OTP Button Click Handler
  document.getElementById("verifyOTPButton").addEventListener("click", function() {
    const userEnteredOTP = document.getElementById("otpInput").value;

    if (userEnteredOTP === generatedOTP) {
      alert("OTP Verification Successful!");

      // STEP 3: Save Verified Member Data to Firebase Auth & Firestore Database
      createUserWithEmailAndPassword(auth, tempUserData.email, tempUserData.password)
        .then((userCredential) => {
          const user = userCredential.user;

          // Storing user's Name, Phone, and Email inside Firestore "members" collection
          setDoc(doc(db, "members", user.uid), {
            name: tempUserData.name,
            phone: tempUserData.phone,
            email: tempUserData.email,
            createdAt: new Date()
          })
          .then(() => {
            alert("Success! Member data securely saved to Firebase Database.");
            window.location.href = "dashboard.html"; // Redirect to dashboard page
          })
          .catch((error) => {
            alert("Database Error: Failed to save member info: " + error.message);
          });

        })
        .catch((error) => {
          alert("Firebase Authentication Error: " + error.message);
        });

    } else {
      alert("Invalid OTP! Please enter the correct code from your email.");
    }
  });
        </script>
