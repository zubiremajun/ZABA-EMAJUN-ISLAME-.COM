<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaba Emajun Islame - Registration</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .form-container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; }
    .logo-container { text-align: center; margin-bottom: 15px; }
    .logo-container img { width: 100px; height: 100px; border-radius: 50%; border: 2px solid #007bff; object-fit: cover; display: inline-block; }
    .company-name { font-size: 18px; font-weight: bold; color: #007bff; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .form-container h2 { text-align: center; color: #333; margin-bottom: 20px; margin-top: 5px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
    .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
    
    .password-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
    .password-wrapper input { padding-right: 40px; }
    .toggle-password { position: absolute; right: 10px; cursor: pointer; font-size: 18px; user-select: none; }

    .btn { width: 100%; padding: 12px; background: #007bff; border: none; color: white; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #0056b3; }
    .btn:disabled { background: #cccccc; cursor: not-allowed; }
    
    #otpSection { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed #ddd; }
    .timer-style { font-size: 14px; color: #ff9800; font-weight: bold; margin-top: 5px; display: block; text-align: left; }
    .warning-style { font-size: 14px; color: #dc3545; font-weight: bold; margin-top: 5px; display: none; text-align: left; }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/16JqDei6AtMnzPDgZenhBUxrbevlj18fN" alt="Zaba Emajun Islame Logo">
      <div class="company-name">ZABA EMAJUN ISLAME</div>
    </div>
    
    <h2>Member Registration</h2>
    
    <form id="registrationForm">
      <div class="input-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter full name" required>
      </div>
      <div class="input-group">
        <label for="phoneNumber">Phone Number</label>
        <input type="tel" id="phoneNumber" placeholder="Enter phone number" required>
      </div>
      <div class="input-group">
        <label for="emailAddress">Email Address</label>
        <input type="email" id="emailAddress" placeholder="Enter email" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Create password" required>
          <span id="togglePasswordBtn" class="toggle-password">👁️</span>
        </div>
      </div>
      <button type="submit" id="sendOtpBtn" class="btn">Send OTP Code</button>
    </form>

    <div id="otpSection">
      <div class="input-group">
        <label for="otpInput">Enter 6-Digit OTP</label>
        <input type="text" id="otpInput" placeholder="Enter OTP code" maxlength="6">
        <span id="timerText" class="timer-style"></span>
        <span id="warningText" class="warning-style">❌ Timeout! This OTP has expired. Please request a new one.</span>
      </div>
      <button id="verifyOTPButton" class="btn" style="background: #28a745; margin-bottom: 10px;">Verify & Register</button>
      <button id="resendOTPButton" class="btn" style="background: #6c757d; display: none;">Resend OTP</button>
    </div>
  </div>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANnOJ_5DiOY3h5q1sVdXqrAblSGynCqKQ",
      authDomain: "zaba-emajun-islam.firebaseapp.com",
      projectId: "zaba-emajun-islam",
      storageBucket: "zaba-emajun-islam.firebasestorage.app",
      messagingSenderId: "593592059226",
      appId: "1:593592059226:web:bfd81719f87e065dc19f63"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAIL = "zubirosmani0@gmail.com";

    emailjs.init("3Hbg-0gXLuoRnX2pC"); 

    let generatedOTP = null;
    let tempUserData = {};
    let countdownInterval = null;
    let isOtpExpired = false;

    document.getElementById("togglePasswordBtn").addEventListener("click", function() {
      const passwordInput = document.getElementById("password");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        this.innerText = "🙈";
      } else {
        passwordInput.type = "password";
        this.innerText = "👁️";
      }
    });

    function sendOTP() {
      generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
      isOtpExpired = false;

      const emailParams = {
        to_email: tempUserData.email,
        to_name: tempUserData.name,
        otp_code: generatedOTP
      };

      emailjs.send("service_pf74nir", "template_843o01l", emailParams)
        .then(function() {
          alert("An OTP code has been successfully sent to your Gmail!");
          document.getElementById("otpSection").style.display = "block";
          startTimer(60);
        }, function(error) {
          alert("EmailJS Error: Failed to send OTP.");
          console.log("Error details:", error);
        });
    }

    function startTimer(seconds) {
      clearInterval(countdownInterval);
      const timerText = document.getElementById("timerText");
      const warningText = document.getElementById("warningText");
      const verifyBtn = document.getElementById("verifyOTPButton");
      const resendBtn = document.getElementById("resendOTPButton");
      const otpInput = document.getElementById("otpInput");

      timerText.style.display = "block";
      warningText.style.display = "none";
      verifyBtn.disabled = false;
      resendBtn.style.display = "none";
      otpInput.disabled = false;
      otpInput.value = "";

      let timeLeft = seconds;

      countdownInterval = setInterval(function() {
        timeLeft--;
        timerText.innerText = "⏳ Time Left: " + timeLeft + "s";

        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          isOtpExpired = true;
          timerText.style.display = "none";
          warningText.style.display = "block";
          verifyBtn.disabled = true;
          resendBtn.style.display = "block";
          otpInput.disabled = true;
        }
      }, 1000);
    }

    document.getElementById("registrationForm").addEventListener("submit", function(e) {
      e.preventDefault();

      tempUserData = {
        name: document.getElementById("fullName").value,
        phone: document.getElementById("phoneNumber").value,
        email: document.getElementById("emailAddress").value.trim().toLowerCase(),
        password: document.getElementById("password").value
      };

      sendOTP();
    });

    document.getElementById("resendOTPButton").addEventListener("click", function() {
      sendOTP();
    });

    document.getElementById("verifyOTPButton").addEventListener("click", function() {
      const userEnteredOTP = document.getElementById("otpInput").value;

      if (isOtpExpired) {
        alert("This OTP code has expired! Please click Resend OTP.");
        return;
      }

      if (userEnteredOTP === generatedOTP) {
        clearInterval(countdownInterval);
        alert("OTP Verification Successful!");

        createUserWithEmailAndPassword(auth, tempUserData.email, tempUserData.password)
          .then((userCredential) => {
            const user = userCredential.user;

            setDoc(doc(db, "members", user.uid), {
              name: tempUserData.name,
              phone: tempUserData.phone,
              email: tempUserData.email,
              createdAt: new Date()
            })
            .then(() => {
              alert("Success! Member data securely saved to Firebase Database.");
              
              // ফিক্সড লজিক: এডমিন ইমেইল হলে এডমিন ড্যাশবোর্ডে পাঠাবে, নাহলে নরমাল ড্যাশবোর্ডে
              if (tempUserData.email === ADMIN_EMAIL) {
                window.location.href = "admin-dashboard.html";
              } else {
                window.location.href = "dashboard.html";
              }
            })
            .catch((error) => {
              alert("Database Error: " + error.message);
            });
          })
          .catch((error) => {
            alert("Firebase Auth Error: " + error.message);
          });
      } else {
        alert("Invalid OTP! Please enter the correct code from your email.");
      }
    });
  </script>
</body>
  </html>
