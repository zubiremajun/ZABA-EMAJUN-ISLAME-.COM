<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAVIISLAM TECH & LOGISTICS - Registration</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f7f3e8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
    .form-container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(127,29,29,0.18); border-top: 5px solid #b91c3c; width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; }
    .back-row { text-align: left; margin-bottom: 10px; }
    .btn-back { display: inline-block; padding: 8px 14px; background: #ffffff; color: #6b21a8; border: 1.5px solid #6b21a8; border-radius: 6px; font-size: 14px; font-weight: bold; text-decoration: none; }
    .btn-back:hover { background: #6b21a8; color: #ffffff; }
    .logo-container { text-align: center; margin-bottom: 15px; }
    .logo-container img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #c9a24b; object-fit: cover; display: inline-block; }
    .company-name { font-size: 18px; font-weight: bold; color: #7f1d1d; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .form-container h2 { text-align: center; color: #333; margin-bottom: 20px; margin-top: 5px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
    .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
    .input-group input:focus { border-color: #6b21a8; outline: none; }

    .toggle-password { display: inline-block; margin-top: 6px; cursor: pointer; font-size: 13px; font-weight: bold; color: #b91c3c; user-select: none; }

    .btn { width: 100%; padding: 12px; background: #15803d; border: none; color: white; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #166534; }
    .btn:disabled { background: #cccccc; cursor: not-allowed; }

    #otpSection { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed #ddd; }
    .timer-style { font-size: 14px; color: #ff9800; font-weight: bold; margin-top: 5px; display: block; text-align: left; }
    .warning-style { font-size: 14px; color: #dc3545; font-weight: bold; margin-top: 5px; display: none; text-align: left; }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="back-row">
      <a href="index.html" class="btn-back">&larr; Back</a>
    </div>

    <div class="logo-container">
      <img src="https://i.postimg.cc/28NBQ4WH/1781359235072-removebg-preview.png" alt="JAVIISLAM TECH & LOGISTICS Logo">
      <div class="company-name">JAVIISLAM TECH & LOGISTICS</div>
    </div>

    <h2>Member Registration</h2>

    <form id="registrationForm">
      <div class="input-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="Enter first name" required>
      </div>
      <div class="input-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter full name" required>
      </div>
      <div class="input-group">
        <label for="birthPlace">Birth Place</label>
        <input type="text" id="birthPlace" placeholder="Enter birth place" required>
      </div>
      <div class="input-group">
        <label for="phoneNumber">Phone Number</label>
        <input type="tel" id="phoneNumber" placeholder="Enter phone number" required>
      </div>
      <div class="input-group">
        <label for="emailAddress">Email Address</label>
        <input type="email" id="emailAddress" placeholder="Enter email" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create password" required>
        <span class="toggle-password" data-target="password">Show Password</span>
      </div>
      <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
        <span class="toggle-password" data-target="confirmPassword">Show Password</span>
      </div>
      <button type="submit" id="sendOtpBtn" class="btn">Send OTP Code</button>
    </form>

    <div id="otpSection">
      <div class="input-group">
        <label for="otpInput">Enter 6-Digit OTP</label>
        <input type="text" id="otpInput" placeholder="Enter OTP code" maxlength="6">
        <span id="timerText" class="timer-style"></span>
        <span id="warningText" class="warning-style">❌ Timeout! This OTP has expired. Please request a new one.</span>
      </div>
      <button id="verifyOTPButton" class="btn" style="background: #15803d; margin-bottom: 10px;">Verify & Register</button>
      <button id="resendOTPButton" class="btn" style="background: #6b21a8; display: none;">Resend OTP</button>
    </div>
  </div>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANnOJ_5DiOY3h5q1sVdXqrAblSGynCqKQ",
      authDomain: "zaba-emajun-islam.firebaseapp.com",
      projectId: "zaba-emajun-islam",
      storageBucket: "zaba-emajun-islam.firebasestorage.app",
      messagingSenderId: "593592059226",
      appId: "1:593592059226:web:bfd81719f87e065dc19f63"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAIL = "zubirosmani0@gmail.com";

    emailjs.init("3Hbg-0gXLuoRnX2pC");

    let generatedOTP = null;
    let tempUserData = {};
    let countdownInterval = null;
    let isOtpExpired = false;

    // Show Password / Hide Password toggles (for both password fields)
    document.querySelectorAll(".toggle-password").forEach(function(btn) {
      btn.addEventListener("click", function() {
        const input = document.getElementById(this.getAttribute("data-target"));
        if (input.type === "password") {
          input.type = "text";
          this.innerText = "Hide Password";
        } else {
          input.type = "password";
          this.innerText = "Show Password";
        }
      });
    });

    function sendOTP() {
      generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
      isOtpExpired = false;

      const emailParams = {
        to_email: tempUserData.email,
        to_name: tempUserData.name,
        otp_code: generatedOTP
      };

      emailjs.send("service_pf74nir", "template_843o01l", emailParams)
        .then(function() {
          alert("An OTP code has been successfully sent to your Gmail!");
          document.getElementById("otpSection").style.display = "block";
          startTimer(60);
        }, function(error) {
          alert("EmailJS Error: Failed to send OTP.");
          console.log("Error details:", error);
        });
    }

    function startTimer(seconds) {
      clearInterval(countdownInterval);
      const timerText = document.getElementById("timerText");
      const warningText = document.getElementById("warningText");
      const verifyBtn = document.getElementById("verifyOTPButton");
      const resendBtn = document.getElementById("resendOTPButton");
      const otpInput = document.getElementById("otpInput");

      timerText.style.display = "block";
      warningText.style.display = "none";
      verifyBtn.disabled = false;
      resendBtn.style.display = "none";
      otpInput.disabled = false;
      otpInput.value = "";

      let timeLeft = seconds;

      countdownInterval = setInterval(function() {
        timeLeft--;
        timerText.innerText = "⏳ Time Left: " + timeLeft + "s";

        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          isOtpExpired = true;
          timerText.style.display = "none";
          warningText.style.display = "block";
          verifyBtn.disabled = true;
          resendBtn.style.display = "block";
          otpInput.disabled = true;
        }
      }, 1000);
    }

    document.getElementById("registrationForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const pass = document.getElementById("password").value;
      const confirmPass = document.getElementById("confirmPassword").value;

      if (pass !== confirmPass) {
        alert("Passwords do not match! Please enter the same password in both fields.");
        return;
      }

      tempUserData = {
        firstName: document.getElementById("firstName").value.trim(),
        name: document.getElementById("fullName").value,
        birthPlace: document.getElementById("birthPlace").value.trim(),
        phone: document.getElementById("phoneNumber").value,
        email: document.getElementById("emailAddress").value.trim().toLowerCase(),
        password: pass
      };

      sendOTP();
    });

    document.getElementById("resendOTPButton").addEventListener("click", function() {
      sendOTP();
    });

    document.getElementById("verifyOTPButton").addEventListener("click", function() {
      const userEnteredOTP = document.getElementById("otpInput").value;

      if (isOtpExpired) {
        alert("This OTP code has expired! Please click Resend OTP.");
        return;
      }

      if (userEnteredOTP === generatedOTP) {
        clearInterval(countdownInterval);
        alert("OTP Verification Successful!");

        createUserWithEmailAndPassword(auth, tempUserData.email, tempUserData.password)
          .then((userCredential) => {
            const user = userCredential.user;

            setDoc(doc(db, "members", user.uid), {
              firstName: tempUserData.firstName,
              name: tempUserData.name,
              birthPlace: tempUserData.birthPlace,
              phone: tempUserData.phone,
              email: tempUserData.email,
              createdAt: new Date()
            })
            .then(() => {
              alert("Success! Member data securely saved to Firebase Database.");

              if (tempUserData.email === ADMIN_EMAIL) {
                window.location.href = "admin-dashboard.html";
              } else {
                window.location.href = "dashboard.html";
              }
            })
            .catch((error) => {
              alert("Database Error: " + error.message);
            });
          })
          .catch((error) => {
            alert("Firebase Auth Error: " + error.message);
          });
      } else {
        alert("Invalid OTP! Please enter the correct code from your email.");
      }
    });
  </script>
</body>
</html>
