<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login - ZABÀ EMAJUN ISLAME</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 380px; box-sizing: border-box; text-align: center; }
        .logo { width: 100px; height: 100px; margin-bottom: 10px; border-radius: 50%; border: 3px solid #7e22ce; }
        h2 { color: #1f2937; margin-bottom: 20px; font-size: 22px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; color: #4b5563; font-size: 14px; font-weight: 500; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .input-group input:focus { border-color: #7e22ce; outline: none; }
        .error-message { color: #dc2626; font-size: 14px; margin-top: 5px; display: none; font-weight: 500; text-align: left; }
        .btn-login { width: 100%; padding: 12px; background-color: #7e22ce; color: white; border: none; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-login:hover { background-color: #6b21a8; }
        .btn-login:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .reg-link { margin-top: 20px; font-size: 14px; color: #4b5563; }
        .reg-link a { color: #7e22ce; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-box">
    <img class="logo" src="https://lh3.googleusercontent.com/d/16JqDei6AtMnzPDgZenhBUxrbevlj18fN" alt="Logo">
    <h2>ZABÀ EMAJUN ISLAME</h2>
    
    <form id="mainLoginForm">
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter email" required>
            <div class="error-message" id="emailError">Email is not registered!</div>
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
            <div class="error-message" id="passwordError">Incorrect password!</div>
        </div>
        
        <button type="submit" class="btn-login" id="submitBtn">Sign In</button>
    </form>

    <div class="reg-link">
        Don't have an account? <a href="register.html">Register Here</a>
    </div>
</div>

<script type="module">
    // Using official Firebase CDN modules directly
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Your real Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyANnOJ_5DiOY3h5q1sVdXqrAblSGynCqKQ",
        authDomain: "zaba-emajun-islam.firebaseapp.com",
        projectId: "zaba-emajun-islam",
        storageBucket: "zaba-emajun-islam.firebasestorage.app",
        messagingSenderId: "593592059226",
        appId: "1:593592059226:web:bfd81719f87e065dc19f63"
    };

    // Initialize Firebase Services
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const ADMIN_EMAIL = "zubirosmani0@gmail.com";

    // Login Submit Action Engine
    document.getElementById('mainLoginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        // Reset error messages visibility
        document.getElementById('emailError').style.display = 'none';
        document.getElementById('passwordError').style.display = 'none';

        const emailInput = document.getElementById('email').value.trim().toLowerCase();
        const passwordInput = document.getElementById('password').value;
        const submitBtn = document.getElementById('submitBtn');

        // Lock button to prevent double submissions
        submitBtn.disabled = true;
        submitBtn.innerText = "Verifying...";

        try {
            // Direct secure authentication via Firebase Auth
            await signInWithEmailAndPassword(auth, emailInput, passwordInput);
            
            // Redirect immediately based on user role upon successful login
            if (emailInput === ADMIN_EMAIL) {
                window.location.href = "admin-dashboard.html";
            } else {
                window.location.href = "dashboard.html";
            }

        } catch (error) {
            // Unlock button for re-attempt
            submitBtn.disabled = false;
            submitBtn.innerText = "Sign In";
            
            console.error("Firebase Auth Error Code:", error.code);

            // Display precise error feedback based on Firebase error codes
            if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-email') {
                document.getElementById('emailError').style.display = 'block';
            } else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                document.getElementById('passwordError').style.display = 'block';
            } else {
                alert("Login Failed: " + error.message);
            }
        }
    });
</script>

</body>
</html>
